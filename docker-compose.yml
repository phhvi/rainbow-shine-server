# Local development infrastructure. Start with:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: rainbow-shine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rainbow
      POSTGRES_PASSWORD: rainbow
      POSTGRES_DB: rainbow_shine
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainbow -d rainbow_shine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
